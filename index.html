<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="A responsive Myntra UI clone built with HTML and CSS. Features modern e-commerce layouts, fashion categories, and clean design components.">
    <title>Myntra-UI-Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mediaqueries.css">
    <link rel="icon" type="image/png" href="images/favicon/favicon-96x96.pn?v=2g" sizes="96x96" />
    <link rel="icon" type="images/favicon/image/svg+xml" href="images/favicon/favicon.svg?v=2" />
    <link rel="shortcut icon" href="images/favicon/favicon.ico?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="images/favicon/site.webmanifest?v=2" />
</head>

<body>
    <header>
        <div class="logo-container">
            <div class="logo">
                <a href="#">
                    <img src="images/myntra-logo.svg" width="100px" alt="logo">
                </a>
            </div>
        </div>
        <nav>
            <div class="navbar">
                <ul>
                    <li><a href="">MEN</a></li>
                    <li><a href="">WOMEN</a></li>
                    <li><a href="">KIDS</a></li>
                    <li><a href="">HOME</a></li>
                    <li><a href="">BEAUTY</a></li>
                    <li><a href="">GENZ</a></li>
                    <li><a href="">STUDIO<sup>NEW</sup></a></li>
                </ul>
            </div>
        </nav>
        <div class="search-product">
            <div class="search-icon-container">
                <span class="search-icon"></span>
            </div>
            <div class="search-input">
                <input type="text">
            </div>
        </div>
        <div class="header-actions">
            <div class="header-actions-inner">
                <div class="user-profile">
                    <span class="user-profile-icon"></span>
                    <span></span>
                </div>
                <div class="wishlist">
                    <span class="wishlist-icon"></span>
                    <span></span>
                </div>
                <div class="shopping-bag">
                    <span class="bag-icon"></span>
                    <span></span>
                </div>
            </div>
        </div>
    </header>
    <main>
        <section class="banners">
            <div class="banner-container">
                <div class="welcome-offer-banner">
                    <img src="" alt="">
                </div>
                <div class="main-hero-banner-container">
                    <div class="hero-section-banner">
                        <img src="" alt="">
                    </div>
                </div>
                <div class="3dots">
                    <div class="dots-image">
                        <img src="" alt="">
                    </div>
                </div>
                <div class="band-discount-gif">
                    <img src="" alt="">
                </div>
            </div>
        </section>

        


    </main>
    <footer></footer>

</body>

</html>
